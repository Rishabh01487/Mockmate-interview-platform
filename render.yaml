services:
  - type: web
    name: mockmate-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # Set in Render dashboard → from MongoDB Atlas
      - key: JWT_SECRET
        sync: false          # Set in Render dashboard → any long random string
      - key: AI_API_URL
        sync: false          # Set in Render dashboard → https://api.deepseek.com/v1
      - key: AI_API_KEY
        sync: false          # Set in Render dashboard → your DeepSeek API key
      - key: AI_MODEL
        value: deepseek-chat
      - key: CLIENT_URL
        sync: false          # Set in Render dashboard → your Vercel frontend URL
    healthCheckPath: /api/health
