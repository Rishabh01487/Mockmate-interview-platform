services:
  - type: web
    name: mockmate-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # Set in Render dashboard → from MongoDB Atlas
      - key: JWT_SECRET
        sync: false          # Set in Render dashboard → any long random string
      - key: AI_API_URL
        sync: false          # Set in Render dashboard → e.g. https://api.groq.com/openai/v1
      - key: AI_API_KEY
        sync: false          # Set in Render dashboard → your Groq/AI provider API key
      - key: AI_MODEL
        value: llama3-70b-8192
      - key: CLIENT_URL
        sync: false          # Set in Render dashboard → your Vercel frontend URL
    healthCheckPath: /api/health
