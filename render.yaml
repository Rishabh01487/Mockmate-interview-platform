services:
  - type: web
    name: mockmate-backend
    runtime: node
    buildCommand: cd backend && npm install && cd .. && npm run build
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # Set in Render dashboard → from MongoDB Atlas
      - key: JWT_SECRET
        sync: false          # Set in Render dashboard → any long random string
      - key: AI_API_URL
        value: https://api.deepseek.com/v1
      - key: AI_API_KEY
        value: sk-2eb60e010747407795d24dbf5516197b
      - key: AI_MODEL
        value: deepseek-v4-flash
      - key: CLIENT_URL
        sync: false          # Set in Render dashboard → your Vercel frontend URL
    healthCheckPath: /api/health