services:
  - type: web
    name: mockmate-backend
    runtime: node
    buildCommand: cd backend && npm install && cd .. && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # Set in Render dashboard → from MongoDB Atlas
      - key: JWT_SECRET
        sync: false          # Set in Render dashboard → any long random string
      - key: AI_API_URL
        value: https://ollama.com/v1
      - key: AI_API_KEY
        sync: false          # Set in Render dashboard → your Ollama cloud API key
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: CLIENT_URL
        sync: false          # Set in Render dashboard → your Vercel frontend URL
    healthCheckPath: /api/health
s